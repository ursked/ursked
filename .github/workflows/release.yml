# Build and publish ursked Community Edition images on a version tag.
#
# Trigger: pushing a tag like v0.1.0. Each image is pushed to BOTH registries
# and tagged with the version and `latest`:
#
#   docker.io/ursked/backend:v0.1.0   docker.io/ursked/backend:latest
#   docker.io/ursked/frontend:v0.1.0  docker.io/ursked/frontend:latest
#   ghcr.io/ursked/backend:v0.1.0     ghcr.io/ursked/backend:latest
#   ghcr.io/ursked/frontend:v0.1.0    ghcr.io/ursked/frontend:latest
#
# Docker Hub auth comes from the repository secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN. GHCR uses the workflow's built-in GITHUB_TOKEN — no secret
# to configure.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: backend
            context: ./backend
            target: runtime
          - name: frontend
            context: ./frontend
            target: runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/ursked/${{ matrix.component.name }}
            ghcr.io/ursked/${{ matrix.component.name }}
          # The git tag (e.g. v0.1.0) plus a moving `latest`.
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          target: ${{ matrix.component.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

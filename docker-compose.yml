# ursked Community Edition — self-hosted stack.
#
# Copy .env.example to .env, fill it in, then:
#     docker compose up -d
#
# On first boot the backend runs migrations and seeds ONE organization and ONE
# administrator from ORG_NAME / ADMIN_EMAIL / ADMIN_PASSWORD. If ADMIN_PASSWORD
# is left blank a password is generated and printed once in the backend logs:
#     docker compose logs backend
#
# There is no landing page and no self-registration: this is a single-tenant
# install. Put a TLS-terminating reverse proxy in front of the frontend port.

services:
  db:
    image: postgres:15.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ursked}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only — the database is never exposed to the network.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging: *default_logging

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ursked}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "${DEBUG:-false}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required - generate with python3 -c "import secrets; print(secrets.token_urlsafe(64))"}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # No-TLS trial opt-in: downgrades the COOKIE_SECURE / http-CORS production
      # guards to warnings so the app runs as production over plain HTTP on a
      # trusted network. Never enable this internet-facing. See .env.example.
      ALLOW_INSECURE_TRANSPORT: "${ALLOW_INSECURE_TRANSPORT:-false}"
      EXPOSE_API_DOCS: "${EXPOSE_API_DOCS:-false}"
      # First-boot bootstrap (see backend/seed_ce.py). Consumed only when the
      # database has no users yet; ignored on every subsequent start.
      ORG_NAME: ${ORG_NAME:-My Organization}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-}
      TZ: ${TZ:-UTC}
    # The image ENTRYPOINT runs the alembic migrations; this command then seeds
    # the single tenant + admin (idempotent) before starting the API server.
    command:
      - sh
      - -c
      - "python seed_ce.py && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    volumes:
      - backups:/backups
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    logging: *default_logging

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    environment:
      # Empty: the browser calls same-origin /api/*, which Next rewrites to the
      # backend. Keeps auth cookies first-party and avoids CORS entirely.
      NEXT_PUBLIC_API_URL: ""
      API_INTERNAL_URL: http://backend:8000
    # Serves on all interfaces by default so the app is reachable on the LAN.
    # For production, put a TLS-terminating reverse proxy in front of this and
    # keep COOKIE_SECURE=true. To restrict to loopback, change this to
    # "127.0.0.1:3000:3000".
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    logging: *default_logging

volumes:
  postgres_data:
  redis_data:
  backups:
